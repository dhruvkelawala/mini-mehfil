  <main>
    <section class="identity" aria-labelledby="brand-title">
      <h1 id="brand-title" aria-label="Mini Mehfil"><span class="mini" aria-hidden="true">Mini</span>महफ़िल</h1>
      <p class="tagline">A private song room. Write the words, set the mood, let them sing.</p>
    </section>

    <form id="song-form" class="composer">
      <div class="composer-head">
        <h2>Make a song</h2>
        <span class="price">≈ $0.15</span>
      </div>

      <label class="field token-field">
        <span>MiniMax token</span>
        <div class="input-wrap">
          <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" placeholder="sk-cp-••••••••" required>
          <button type="button" id="reveal-token" class="reveal" aria-label="Show token" aria-pressed="false">Show</button>
        </div>
        <small>Used for this request only. Never saved.</small>
      </label>

      <label class="field">
        <span>What's the song about?</span>
        <input id="idea" name="idea" type="text" maxlength="400" required placeholder="Aloopuri Khavsa">
        <small>Any language, typed however you type. We'll figure out the rest.</small>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Vibe <em>optional</em></span>
          <input id="vibe" name="vibe" type="text" maxlength="400" placeholder="hip hop, upbeat">
        </label>
        <label class="field">
          <span>Language</span>
          <select id="language" name="language">
            <option value="auto" selected>Auto-detect</option>
            <option value="Gujarati">Gujarati</option>
            <option value="Hindi">Hindi</option>
            <option value="Punjabi">Punjabi</option>
            <option value="Tamil">Tamil</option>
            <option value="Bengali">Bengali</option>
            <option value="Marathi">Marathi</option>
            <option value="Urdu">Urdu</option>
            <option value="English">English</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="Arabic">Arabic</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
          </select>
        </label>
      </div>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <button class="generate" type="submit"><span class="button-label">Start the mehfil</span><span class="arrow">→</span></button>
      <p class="cost-hint" id="cost-hint">Lyrics cost about a tenth of a cent. The song costs ≈ $0.15.</p>
    </form>
  </main>

  <section class="performance" id="performance" role="dialog" aria-labelledby="performance-title" hidden>
    <h2 class="sr-only" id="performance-title">Your mehfil performance</h2>
    <button class="performance-close" id="performance-close" type="button" aria-label="Close performance">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
    <div class="performance-content">
      <div class="performance-status" id="performance-status" role="status" aria-live="polite"></div>
      <!-- The words are written before the song records. Peeking is opt-in. -->
      <div class="peek" id="peek" hidden>
        <button type="button" class="peek-toggle" id="peek-toggle" aria-expanded="false" aria-controls="lyric-reveal">
          <strong>Reveal lyrics</strong>
          <small>Wanna be surprised? Don't click me.</small>
        </button>
      </div>
      <div class="lyric-reveal" id="lyric-reveal" hidden>
        <span class="reveal-language" id="reveal-language"></span>
        <p class="reveal-lines" id="reveal-lines"></p>
      </div>
      <button class="performance-replay" id="performance-replay" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8V4m0 0h4M5 4l3.1 3.1a7 7 0 1 1-1.4 7.2"/></svg>
        <span>Replay the mehfil</span>
      </button>
    </div>
  </section>

  <section class="player-shell" id="player-shell" aria-label="Song player">
    <div class="record" aria-hidden="true"><div class="record-label">M</div></div>
    <div class="track">
      <strong id="track-title">Your song will appear here</strong>
      <span id="track-subtitle">MiniMax Music 3</span>
      <div class="timeline"><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><span id="timecode">0:00 / 0:00</span></div>
    </div>
    <button id="play" class="play" type="button" aria-label="Play" disabled><span>▶</span></button>
    <a id="download" class="download" href="#" download="mehfil-song.mp3" aria-disabled="true">↓<span>Save</span></a>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <script src="/app.js"></script>
</body>
</html>
