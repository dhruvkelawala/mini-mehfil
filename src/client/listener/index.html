<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f4238" />
    <meta name="mehfil-room-id" content="__MEHFIL_ROOM_ID__" />
    <title>Mini Mehfil · Listener</title>
    <meta
      name="description"
      content="Join a live mehfil. Request a song, then hear every recording together with the room — no account and no key."
    />
    <meta property="og:site_name" content="Mini Mehfil" />
    <meta property="og:title" content="Join the mehfil · Mini Mehfil" />
    <meta property="og:type" content="website" />
    <!-- No og:url: every room has its own /r/CODE address and a fixed value
         would send every invitation to the wrong page. Readers fall back to
         the URL they requested. -->
    <meta
      property="og:description"
      content="Join a live mehfil. Request a song, then hear every recording together with the room — no account and no key."
    />
    <meta
      property="og:image"
      content="https://minimehfil.wtf/og/mini-mehfil-card.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Musicians playing on a courtyard rooftop at dusk under the Mini Mehfil wordmark"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join the mehfil · Mini Mehfil" />
    <meta
      name="twitter:description"
      content="Join a live mehfil. Request a song, then hear every recording together with the room — no account and no key."
    />
    <meta
      name="twitter:image"
      content="https://minimehfil.wtf/og/mini-mehfil-card.jpg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
